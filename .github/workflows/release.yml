# Builds GInspectorAdvanced for Windows and Linux and attaches the files to a
# GitHub release. Push a tag such as v1.0.0 to publish one:
#   git tag v1.0.0 && git push origin v1.0.0
# It can also be started by hand (Actions ▸ Release ▸ Run workflow) to only
# build the files, which are then kept as workflow artifacts.
#
# The file names are fixed so the download links on the website
# (releases/latest/download/<name>) always point to the newest version.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.8.3'

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGIA_BUILD_TESTS=OFF
          cmake --build build

      - name: Package
        shell: pwsh
        run: |
          $dist = "dist/GInspectorAdvanced"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/GInspectorAdvanced.exe $dist/
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$dist/GInspectorAdvanced.exe"
          Copy-Item README.md $dist/
          Compress-Archive -Path $dist -DestinationPath GInspectorAdvanced-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: GInspectorAdvanced-windows-x64.zip

  linux:
    # The oldest supported runner, so the AppImage runs on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libfuse2

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGIA_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          DESTDIR=$PWD/AppDir cmake --install build

      - name: Package AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE="$(command -v qmake6 || command -v qmake)"
          export LDAI_OUTPUT=GInspectorAdvanced-linux-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/ginspectoradvanced.desktop \
            --icon-file resources/icons/app.png --icon-filename ginspectoradvanced \
            --plugin qt --output appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: GInspectorAdvanced-linux-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: GInspectorAdvanced ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            GInspectorAdvanced-windows-x64.zip
            GInspectorAdvanced-linux-x86_64.AppImage
